<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050607">
  <meta name="color-scheme" content="dark">
  <title>운영 대시보드</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="loginOverlay" class="overlay">
    <form id="loginForm" class="loginbox" novalidate>
      <h2>직원용 웹 접속</h2>
      <p class="sub">관리자 PIN을 입력하세요.</p>
      <label class="sr-only" for="pinInput">관리자 PIN</label>
      <input id="pinInput" name="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN" autocomplete="current-password">
      <button id="loginButton" class="primary" type="submit">접속</button>
      <p id="loginError" class="error" role="alert" aria-live="polite"></p>
    </form>
  </div>

  <header>
    <div class="header-row">
      <div>
        <h1>운영 대시보드</h1>
        <div class="connection-line">
          <span id="connectionIcon" class="connection-icon connecting" aria-hidden="true">
            <svg viewBox="0 0 32 32" focusable="false">
              <path class="wifi-wave wave-outer" d="M4 12.5C10.8 6.5 21.2 6.5 28 12.5"/>
              <path class="wifi-wave wave-inner" d="M9 18C13 14.5 19 14.5 23 18"/>
              <circle class="wifi-dot" cx="16" cy="24" r="2.2"/>
              <path class="wifi-slash" d="M6 5L27 27"/>
            </svg>
          </span>
          <span id="connection">연결 확인 중…</span>
        </div>
      </div>
      <button id="installAppButton" class="install-button" type="button" hidden>PC에 앱처럼 설치</button>
    </div>
    <div class="toolbar">
      <label>웹 알람 자동 정지
        <select id="autoStopSelect">
          <option value="5">5초</option>
          <option value="10">10초</option>
          <option value="15">15초</option>
          <option value="20">20초</option>
          <option value="30">30초</option>
          <option value="45">45초</option>
          <option value="60">60초</option>
          <option value="0">자동 정지 안 함</option>
        </select>
      </label>
      <button id="enableAlertsButton" type="button">🔔 웹 알림·소리 사용</button>
      <button id="stopAllAlarmsButton" type="button">알람 모두 끄기</button>
    </div>
    <div id="installHint" class="install-hint" hidden></div>
  </header>

  <div id="alarmBanner" class="alarm-banner" aria-live="assertive"></div>
  <main id="rooms"><div class="empty">불러오는 중…</div></main>

  <noscript>이 웹 화면을 사용하려면 JavaScript를 켜야 합니다.</noscript>
  <script src="/app.js" defer></script>
</body>
</html>
